server {
    listen __PORT__;
    server_name _;
    index index.php index.html;

    root /var/www/public;

    # CSS / JS も UTF-8 として返す（charset_types の既定には text/css が含まれない）
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript text/javascript;

    # Render のヘルスチェック用。PHP も DB も通さずに nginx が答える
    # （Laravel を通すとセッションで DB に触れ、Neon の DB が眠れなくなる）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_body_buffer_size 16K;
    client_max_body_size 10M;
}
