[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel のスケジューラー（毎日 4:00 の demo:reset）。画像を消すので www-data で動かす。
; user= は uid を変えるだけで、HOME は supervisord（root）の /root のまま引き継がれる。
; SSL で DB につなぐとき、libpq が $HOME/.postgresql/postgresql.crt を探し、
; www-data は /root を読めないので接続に失敗する。HOME と USER も www-data のものにする
[program:scheduler]
command=/usr/local/bin/scheduler.sh
user=www-data
environment=HOME="/var/www",USER="www-data"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
