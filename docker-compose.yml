services:
 

    nginx:
        image: nginx:1.21.1
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./src:/var/www/
        depends_on:
            - php

    php:
        build: ./docker/php
        volumes:
            - ./src:/var/www/

    pgsql:
        image: postgres:15
        environment:
            POSTGRES_DB: laravel_db
            POSTGRES_USER: laravel_user
            POSTGRES_PASSWORD: laravel_pass
            TZ: Asia/Tokyo
        command:
            postgres -c timezone=Asia/Tokyo
        ports:
            - "5432:5432"
        volumes:
            - ./docker/postgres/data:/var/lib/postgresql/data

    adminer:
        image: adminer
        environment:
            - ADMINER_DEFAULT_SERVER=pgsql
        depends_on:
            - pgsql
        ports:
            - 8080:8080

 
    mailhog:
         image: mailhog/mailhog:latest
         ports:
             - "8025:8025"
             - "1025:1025"
