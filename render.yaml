services:
  - type: web
    name: frea-market
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    # Same region as the Neon database. Cannot be changed after creation.
    region: singapore
    # Answered by nginx without PHP or the database (docker/render/nginx.conf).
    # A Laravel page would touch the session table every few seconds and keep
    # the Neon database from scaling to zero.
    healthCheckPath: /healthz
    # Do not deploy when a push only changes documentation. Every deploy stops
    # the service briefly (persistent disk) and resets the demo data.
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "**/*.md"
    # Uploaded and seeded images (IMAGE_DISK=public). Everything outside this
    # path is lost on every deploy.
    disk:
      name: frea-market-images
      mountPath: /var/www/storage/app/public
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Flea Market
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Render's generateValue has no "base64:" prefix, which Laravel rejects.
      # Run `php artisan key:generate --show` locally and paste the value.
      - key: APP_KEY
        sync: false
      # The public https:// URL of this service (e.g. https://frea-market.onrender.com).
      # Entered by hand: the onrender.com name may get a suffix, and a fixed
      # value here would be restored on every Blueprint sync.
      # Image URLs are built from it (IMAGE_DISK=public).
      - key: APP_URL
        sync: false
      # Logs go to the Render log stream; files inside the container are lost on deploy.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      # Neon (free plan, aws-ap-southeast-1). Paste the direct connection string
      # (the host WITHOUT "-pooler").
      - key: DATABASE_URL
        sync: false
      # Neon only accepts encrypted connections.
      - key: DB_SSLMODE
        value: require
      # File sessions live outside the disk and would log everyone out on every deploy.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_DRIVER
        value: local
      - key: IMAGE_DISK
        value: public
      - key: QUEUE_CONNECTION
        value: sync
      # Mail is not sent. DEMO_MODE shows the demo login button and restricts
      # login to the demo account.
      - key: MAIL_MAILER
        value: log
      - key: DEMO_MODE
        value: "true"
      # The visitor's address for the registration rate limit. Behind Render's
      # proxy, X-Forwarded-For ends with the proxy's own address.
      - key: DEMO_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # The signing secret of the webhook endpoint registered in the Stripe
      # dashboard (not the one printed by `stripe listen`).
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
